name: Checks

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"
      # 故意不装任何依赖:Decky 冻结的 Python 只能用 stdlib
      - name: Run backend tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  ui:
    name: UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global --ignore-scripts pnpm@11.3.0
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and formatting
        run: pnpm lint
      - name: Build frontend
        run: pnpm build

  zig:
    name: Zig backend (0.17.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZIG_VERSION: "0.17.0"
      ZIG_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Zig
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Test and build dt-monitor
        run: bash scripts/build-backend.sh
